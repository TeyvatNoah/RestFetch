name: Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Cache
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.0'
          # cache: true

      - name: Install Dependencies
        run: dotnet restore -p:Configuration=Release
        # 如果使用nuget+lock则使用以下命令
        # run: dotnet restore --locked-mode

      - name: Get prev commit
        id: vars
        run: echo "prev_sha=$(git rev-parse HEAD~1)" >> $GITHUB_OUTPUT

      - name: Filter Path
        uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ steps.vars.outputs.prev_sha }}
          filters: |
            WebUtilities:
              - 'src/RestFetch.WebUtilities/**'
            Common:
              - 'src/RestFetch.Common/**'
            SourceGenerator:
              - 'src/RestFetch.SourceGenerator/**'
            Extensions:
              - 'src/RestFetch.Extensions/**'
            Core:
              - 'src/RestFetch.Core/**'

      - name: Build WebUtilities
        if: steps.changes.outputs.WebUtilities == 'true'
        run: ./build.sh -z 1 -c src/WebUtilities/WebUtilities.csproj

      - name: Build Common
        if: steps.changes.outputs.Common == 'true'
        run: ./build.sh -z 1 -c src/Common/Common.csproj

      - name: Build SourceGenerator
        if: steps.changes.outputs.SourceGenerator == 'true'
        run: ./build.sh -z 1 -c src/SourceGenerator/SourceGenerator.csproj

      - name: Build Extensions
        if: steps.changes.outputs.Extensions == 'true'
        run: ./build.sh -z 1 -c src/Extensions/Extensions.csproj

      - name: Build Core
        if: steps.changes.outputs.Core == 'true'
        run: ./build.sh -z 1 -c src/Core/Core.csproj